name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Match tags like v1.0.0, v2.1.3, etc.
      - '[0-9]+.[0-9]+.[0-9]+'  # Match tags like 1.0.0, 2.1.3, etc.  
  # Allow manual trigger with tag input
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy the package (optional - uses current ref if empty)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/slice-score/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      # Use trusted publishing (no API token required)
      # Configure this in PyPI: https://pypi.org/manage/account/publishing/