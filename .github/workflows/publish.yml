name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Match tags like v1.0.0, v2.1.3, etc.
      - '[0-9]+.[0-9]+.[0-9]+'  # Match tags like 1.0.0, 2.1.3, etc.  
  # Allow manual trigger with tag input
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy the package (optional - uses current ref if empty)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/slice-score/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      # Use trusted publishing (no API token required)
      # Configure this in PyPI: https://pypi.org/manage/account/publishing/